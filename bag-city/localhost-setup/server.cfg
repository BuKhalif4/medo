# ===== Bag City - إعداد التجربة المحلية (localhost) =====
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 4
sv_hostname "Bag City - Localhost"
sv_licenseKey "PUT_YOUR_KEY_HERE"

# تجربة محلية: بدون تسجيل بقائمة السيرفرات العامة (يسكّت رسالة الخطأ الحمراء)
sv_master1 ""

set onesync on

# بدون بوتات: السيرفر ما يصنع مشاة ولا سيارات (يخفف الحمل كثير)
set onesync_population false
set sv_entityLockdown "relaxed"
sv_scriptHookAllowed 0

# وضع التجربة الفردية: يسمح لك تجرب القبض والرشوة على نفسك. احذفه في سيرفر حقيقي!
set bagcity_solotest "true"

# الموارد الأساسية (جاية مع server-data)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
# مدينة الحقيبة
ensure bagcity

# صلاحيات التجربة: أي لاعب يقدر يكون شرطي/صحفي/مطوّر. احذفها في سيرفر حقيقي!
add_ace builtin.everyone bagcity.cop allow
add_ace builtin.everyone bagcity.ia allow
add_ace builtin.everyone bagcity.press allow
add_ace builtin.everyone bagcity.dev allow
