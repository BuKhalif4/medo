# ===== MDK - إعداد التجربة المحلية (localhost) =====
endpoint_add_tcp "0.0.0.0:30122"
endpoint_add_udp "0.0.0.0:30122"

sv_maxclients 8
sv_hostname "MDK - Localhost"
sv_licenseKey "PUT_YOUR_KEY_HERE"
sv_master1 ""

set onesync on
set onesync_population false
set sv_entityLockdown "relaxed"
sv_scriptHookAllowed 0

ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode

ensure mdk

# صلاحيات التجربة: كل لاعب أدمن ومطوّر وشرطي وصحفي. احذفها في سيرفر حقيقي ووزّعها على مسؤوليك فقط!
add_ace builtin.everyone mdk.admin allow
add_ace builtin.everyone mdk.dev allow
add_ace builtin.everyone mdk.cop allow
add_ace builtin.everyone mdk.press allow
add_ace builtin.everyone mdk.ia allow
